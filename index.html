<!DOCTYPE html>
<html lang="vi">
<head>
    <title>Báo Cáo Nội Bộ OCH</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; overflow: hidden; }
        .box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 320px; z-index: 100; }
        h2 { color: #0078d4; margin-bottom: 10px; }
        input { padding: 12px; width: 100%; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: #0078d4; }
        button { padding: 12px; width: 100%; background: #0078d4; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #005a9e; }
        #reportArea { display: none; width: 100vw; height: 100vh; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="loginGate" class="box">
        <h2>OCH REPORT</h2>
        <p style="color: #666;">Vui lòng nhập mật khẩu truy cập</p>
        <input type="password" id="passInput" placeholder="Mật khẩu..." onkeypress="if(event.keyCode==13) checkPass()">
        <button onclick="checkPass()">ĐĂNG NHẬP</button>
    </div>

    <div id="reportArea">
        <iframe title="2026.OCH_ MONTHLY REPORT" 
                src="https://app.powerbi.com/view?r=eyJrIjoiOWU2OTkzNjMtM2RlMC00ZjQ0LTg5YTAtZGMwYTY5OWU2NjA3IiwidCI6IjE4MmVkZDhiLTQ5YjgtNGFmOC1iNWU0LWY5ZWRmMDhhZTk2NyIsImMiOjEwfQ%3D%3D" 
                allowFullScreen="true"></iframe>
    </div>

    <script>
        function checkPass() {
            var p = document.getElementById("passInput").value;
            if (p === "OCH2026") { 
                document.getElementById("loginGate").style.display = "none";
                document.getElementById("reportArea").style.display = "block";
            } else {
                alert("Mật khẩu không đúng!");
            }
        }
    </script>
</body>
</html>
